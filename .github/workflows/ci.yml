name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash
    working-directory: .
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - run: task check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - run: task lint

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install scanner outside the module
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: task vulncheck

  postgres-rag:
    name: PostgreSQL RAG tool (owned backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Enable vector in owned database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d agentx -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Verify RAG tool, citations and isolation without skips
        env:
          AGENTX_EXAMPLES_IT_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/agentx?sslmode=disable
        run: task test INTEGRATION=true
